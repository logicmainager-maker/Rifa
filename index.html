<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi Rifa</title>
<style>
:root{--bg:#f4f6f8;--card:#fff;--tx:#1b2430;--mut:#6b7785;--bd:#d9dfe6;--ac:#1f6feb;--ok:#2e9e4f;--okbg:#d8f3e0;--wn:#e08a00;--wnbg:#ffe9bf;--rd:#d64545;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12171d;--card:#1c242d;--tx:#eef2f6;--mut:#9aa7b5;--bd:#2f3a46;--okbg:#1d4a2c;--wnbg:#5a4010}}
:root[data-theme="dark"]{--bg:#12171d;--card:#1c242d;--tx:#eef2f6;--mut:#9aa7b5;--bd:#2f3a46;--okbg:#1d4a2c;--wnbg:#5a4010}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.4 Arial,Helvetica,sans-serif;max-width:560px;margin:0 auto;padding:12px 12px 90px}
h1{font-size:20px;margin:4px 0 10px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
label{display:block;font-size:12px;color:var(--mut);margin:8px 0 3px}
input{width:100%;padding:10px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font-size:16px}
.row{display:flex;gap:8px}.row>*{flex:1}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.st{background:var(--bg);border-radius:10px;padding:8px 10px}.st b{display:block;font-size:19px}.st span{font-size:12px;color:var(--mut)}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-size:15px}
.tab.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:7px}
.n{padding:14px 0;border:2px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);font-size:19px;font-weight:700;text-align:center}
.n.d{background:var(--wnbg);border-color:var(--wn)}.n.p{background:var(--okbg);border-color:var(--ok)}
.leg{display:flex;gap:10px;flex-wrap:wrap;font-size:12px;color:var(--mut);margin:8px 0 0}
.leg i{display:inline-block;width:12px;height:12px;border-radius:3px;border:2px solid;vertical-align:-2px;margin-right:4px}
button.b{width:100%;padding:13px;border:0;border-radius:10px;background:var(--ac);color:#fff;font-size:16px;font-weight:700;margin-top:8px}
button.b.g{background:var(--bg);color:var(--tx);border:1px solid var(--bd)}button.b.r{background:var(--rd)}button.b.ok{background:var(--ok)}
.item{display:flex;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}.item:last-child{border:0}
.item small{color:var(--mut);display:block}.debe{color:var(--wn);font-weight:700;text-align:right}.paz{color:var(--ok);font-weight:700;text-align:right}
#md{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:flex-end;z-index:9}
#md.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;margin:0 auto;border-radius:16px 16px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom,0px));max-height:92%;overflow:auto}
.err{color:var(--rd);font-size:13px;min-height:16px}
#img{max-width:100%;border-radius:8px;display:block;margin:0 auto}
.mut{color:var(--mut);font-size:13px}
</style>
</head>
<body>
<h1>🎟️ Mi Rifa</h1>

<div class="card">
  <label>Nombre / premio de la rifa</label>
  <input id="prize" placeholder="Ej: Rifa pro-fondos, premio: moto">
  <div class="row">
    <div><label>Fecha de la rifa</label><input id="date" type="date"></div>
    <div><label>Valor de la boleta ($)</label><input id="price" type="number" inputmode="numeric"></div>
  </div>
  <label>Lotería con la que juega</label>
  <input id="lot" placeholder="Ej: Lotería de Medellín (últimas 2 cifras)">
</div>

<div class="card"><div class="stats" id="stats"></div></div>

<div class="tabs">
  <button class="tab on" data-t="t">Tablero</button>
  <button class="tab" data-t="c">Cobros</button>
</div>

<div id="vt">
  <div class="card">
    <div class="grid" id="grid"></div>
    <div class="leg"><span><i style="border-color:var(--bd)"></i>Disponible</span><span><i style="border-color:var(--wn);background:var(--wnbg)"></i>Vendido, debe</span><span><i style="border-color:var(--ok);background:var(--okbg)"></i>Pagado</span></div>
  </div>
  <button class="b ok" id="share">📸 Crear foto para compartir</button>
  <button class="b g" id="bk">Copiar respaldo de datos</button>
  <button class="b g" id="rs">Restaurar respaldo</button>
  <p class="mut">Los datos se guardan en este celular (en este navegador). Haz respaldo de vez en cuando.</p>
</div>

<div id="vc" style="display:none"><div class="card" id="debts"></div></div>

<div id="md"><div class="sheet" id="sheet"></div></div>

<script>
const NUMS=[];for(let i=0;i<100;i+=2)NUMS.push(String(i).padStart(2,"0"));
const KEY="rifa_pares_v1";
let S={prize:"",date:"",price:20000,lot:"",n:{}};
try{const r=localStorage.getItem(KEY);if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const money=v=>"$"+Math.round(v).toLocaleString("es-CO");
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}};
const fdate=d=>{if(!d)return "";const [y,m,dd]=d.split("-");return new Date(y,m-1,dd).toLocaleDateString("es-CO",{weekday:"long",day:"numeric",month:"long",year:"numeric"})};
const paid=k=>S.n[k]&&S.n[k].paid>=S.price;

function render(){
  $("prize").value=S.prize;$("date").value=S.date;$("price").value=S.price;$("lot").value=S.lot;
  const ks=Object.keys(S.n),sold=ks.length,col=ks.reduce((a,k)=>a+(+S.n[k].paid||0),0),tot=sold*S.price;
  $("stats").innerHTML=[["Vendidos",sold],["Disponibles",NUMS.length-sold],["Recogido",money(col)],["Falta por cobrar",money(Math.max(tot-col,0))]]
   .map(a=>`<div class="st"><span>${a[0]}</span><b>${a[1]}</b></div>`).join("");
  $("grid").innerHTML=NUMS.map(k=>`<button class="n ${S.n[k]?(paid(k)?"p":"d"):""}" data-k="${k}">${k}</button>`).join("");
  // cobros agrupados por comprador
  const g={};ks.forEach(k=>{const d=S.n[k],id=d.name.trim().toLowerCase();(g[id]=g[id]||{name:d.name,ks:[],paid:0,phone:d.phone}).ks.push(k);g[id].paid+=+d.paid||0});
  const L=Object.values(g).map(x=>({...x,debe:x.ks.length*S.price-x.paid})).sort((a,b)=>b.debe-a.debe);
  $("debts").innerHTML=L.length?L.map(x=>`<div class="item"><div><b>${esc(x.name)}</b><small>Nº ${x.ks.join(", ")}${x.phone?" · "+esc(x.phone):""}</small><small>Ha pagado ${money(x.paid)}</small></div>${x.debe>0?`<div class="debe">Debe<br>${money(x.debe)}</div>`:`<div class="paz">Al día ✓</div>`}</div>`).join(""):'<p class="mut">Aún no hay números vendidos.</p>';
}
["prize","date","price","lot"].forEach(id=>$(id).addEventListener("change",()=>{S.prize=$("prize").value;S.date=$("date").value;S.lot=$("lot").value;S.price=Math.max(+$("price").value||20000,1);save();render()}));

document.querySelectorAll(".tab").forEach(b=>b.onclick=()=>{document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",x===b));$("vt").style.display=b.dataset.t=="t"?"":"none";$("vc").style.display=b.dataset.t=="c"?"":"none"});
$("grid").onclick=e=>{const k=e.target.dataset.k;if(k)openNum(k)};

function openNum(k){
  const d=S.n[k]||{name:"",phone:"",paid:0};
  $("sheet").innerHTML=`<h1>Número ${k} ${S.n[k]?"":"· disponible"}</h1>
  <label>Nombre del comprador</label><input id="fn" value="${esc(d.name)}">
  <label>Teléfono</label><input id="fp" type="tel" value="${esc(d.phone)}">
  <label>Lleva pagado ($) — boleta ${money(S.price)}</label><input id="fa" type="number" inputmode="numeric" value="${d.paid||0}">
  <div class="err" id="er"></div>
  <button class="b g" id="full">Pagó completo (${money(S.price)})</button>
  <button class="b" id="ok">Guardar</button>
  ${S.n[k]?'<button class="b r" id="del">Liberar número</button>':""}
  <button class="b g" id="cl">Cerrar</button>`;
  $("md").classList.add("on");
  $("full").onclick=()=>$("fa").value=S.price;
  $("cl").onclick=close;
  $("ok").onclick=()=>{const n=$("fn").value.trim();if(!n){$("er").textContent="Escribe el nombre del comprador.";return}
    S.n[k]={name:n,phone:$("fp").value.trim(),paid:Math.max(+$("fa").value||0,0)};save();close();render()};
  if($("del"))$("del").onclick=()=>{if(confirm("¿Liberar el número "+k+"?")){delete S.n[k];save();close();render()}};
}
function close(){$("md").classList.remove("on")}
$("md").onclick=e=>{if(e.target.id=="md")close()};

// Foto para compartir (sin nombres de compradores)
$("share").onclick=()=>{
  const W=1080,cw=190,ch=92,x0=65,y0=330,H=y0+10*ch+120,c=document.createElement("canvas");c.width=W;c.height=H;
  const g=c.getContext("2d");g.fillStyle="#fff";g.fillRect(0,0,W,H);
  g.fillStyle="#1f3a5f";g.fillRect(0,0,W,y0-30);g.textAlign="center";g.fillStyle="#fff";
  g.font="bold 54px Arial";g.fillText(S.prize||"RIFA",W/2,85,W-80);
  g.font="34px Arial";g.fillText("Boleta: "+money(S.price),W/2,145);
  if(S.date)g.fillText("Juega: "+fdate(S.date),W/2,195,W-60);
  if(S.lot)g.fillText("Lotería: "+S.lot,W/2,245,W-60);
  const sold=Object.keys(S.n).length;g.font="bold 30px Arial";g.fillText("Vendidos: "+sold+"  ·  Disponibles: "+(NUMS.length-sold),W/2,295);
  NUMS.forEach((k,i)=>{const x=x0+(i%5)*cw,y=y0+Math.floor(i/5)*ch,s=!!S.n[k];
    g.fillStyle=s?"#d9d9d9":"#d8f3e0";g.fillRect(x+5,y+5,cw-10,ch-10);g.strokeStyle=s?"#aaa":"#2e9e4f";g.lineWidth=3;g.strokeRect(x+5,y+5,cw-10,ch-10);
    g.fillStyle=s?"#888":"#14532d";g.font="bold 44px Arial";g.fillText(k,x+cw/2,y+ch/2+15);
    if(s){g.strokeStyle="#c0392b";g.lineWidth=5;g.beginPath();g.moveTo(x+18,y+ch-20);g.lineTo(x+cw-18,y+20);g.stroke()}});
  g.font="26px Arial";g.fillStyle="#444";g.fillText("Verde = disponible   ·   Gris tachado = vendido",W/2,H-45);
  const url=c.toDataURL("image/png");
  $("sheet").innerHTML=`<h1>Foto lista</h1><img id="img" src="${url}" alt="Tablero de la rifa"><p class="mut">Pulsa Compartir, o mantén presionada la imagen para guardarla.</p><button class="b ok" id="sh">Compartir</button><button class="b g" id="cl">Cerrar</button>`;
  $("md").classList.add("on");$("cl").onclick=close;
  $("sh").onclick=()=>c.toBlob(async b=>{try{const f=new File([b],"rifa.png",{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[f]}))await navigator.share({files:[f],title:"Rifa"});else alert("Mantén presionada la imagen para guardarla o haz captura de pantalla.")}catch(e){}});
};

$("bk").onclick=async()=>{const t=JSON.stringify(S);try{await navigator.clipboard.writeText(t);alert("Respaldo copiado. Pégalo en un chat o nota para guardarlo.")}catch(e){prompt("Copia este respaldo:",t)}};
$("rs").onclick=()=>{const t=prompt("Pega aquí el respaldo:");if(!t)return;try{const o=JSON.parse(t);if(!o.n)throw 0;S=Object.assign({prize:"",date:"",price:20000,lot:"",n:{}},o);save();render()}catch(e){alert("El respaldo no es válido.")}};
render();
</script>
</body>
</html>
